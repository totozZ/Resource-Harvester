[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-harvester"
version = "0.2.0"
description = "Local multi-site resource harvesting and Bilibili archiving toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "playwright>=1.50",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
resource-harvester = "main:main"

[tool.setuptools]
py-modules = [
    "click_download_buttons",
    "download_page",
    "list_links",
    "main",
    "save_login",
    "smartedu_grade_download",
    "smartedu_xiaoyuan_download",
    "utils",
]

[tool.setuptools.packages.find]
include = ["resource_harvester*"]

[tool.setuptools.package-data]
"resource_harvester.web" = [
    "static/*.css",
    "static/*.js",
    "templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
